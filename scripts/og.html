<!doctype html>
<!-- Open Graph / Twitter share image, 1200×630, one per language. Rendered by
     scripts/og.mjs (headless Chrome) into public/og.png and public/og-tr.png;
     ?lang=tr picks the Turkish copy. Brand: docs/brand-guidelines.md —
     paper, ink and one signal blue; Instrument Serif + Instrument Sans; the
     hero print from src/assets/art/hero.webp beside the headline. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Instrument+Sans:wght@400;500;600&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: "Instrument Sans", system-ui, sans-serif; color: #17181c; background: #f4f3ed; position: relative; }
  .halftone { position: absolute; right: -120px; top: -140px; width: 620px; height: 620px;
    background-image: radial-gradient(circle, #2447d6 1.2px, transparent 1.8px); background-size: 14px 14px; opacity: .14;
    -webkit-mask-image: radial-gradient(closest-side, #000 20%, transparent 100%); mask-image: radial-gradient(closest-side, #000 20%, transparent 100%); }
  .wrap { position: relative; height: 100%; padding: 50px 64px 46px; display: grid; grid-template-columns: 1fr 400px; gap: 48px; align-items: center; }
  .top { display: flex; align-items: center; gap: 14px; font-size: 21px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; }
  .top img { width: 44px; height: 44px; }
  .top span { display: block; color: #4a4c54; font-weight: 400; font-size: 17px; }
  h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 58px; line-height: 1.02; letter-spacing: -.01em; margin-top: 28px; max-width: 19ch; }
  html[lang="tr"] h1 { font-size: 46px; max-width: 24ch; }
  .sub { margin-top: 20px; font-size: 20px; color: #4a4c54; max-width: 34ch; line-height: 1.4; }
  .bottom { margin-top: 26px; display: flex; align-items: center; gap: 22px; font-size: 19px; color: #17181c; font-weight: 500; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #18823f; box-shadow: 0 0 0 4px #d9efe0; }
  .url { font-family: "Instrument Serif", Georgia, serif; font-size: 26px; color: #2447d6; }
  .print { width: 400px; aspect-ratio: 4 / 3; border-radius: 18px; border: 1px solid #d9d7ce; background: #f4f3ed; overflow: hidden; }
  .print img { display: block; width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
  <div class="halftone"></div>
  <div class="wrap">
    <div>
      <div class="top"><img src="../public/logo-mark.svg" alt=""><div>Muhammed Kado<span data-en="Computer Engineer, İstanbul" data-tr="Bilgisayar Mühendisi, İstanbul"></span></div></div>
      <h1 data-en="I build the web side of RFID systems that run in 30+ countries." data-tr="30'dan fazla ülkede kullanılan RFID tabanlı sistemlerin web arayüzlerini geliştiriyorum."></h1>
      <p class="sub" data-en="PHP, Laravel and React. Seven live applications you can open, signed in with one click." data-tr="PHP, Laravel ve React. Tek tıkla giriş yapıp açabileceğiniz yedi canlı uygulama."></p>
      <div class="bottom"><span class="dot"></span><span data-en="All systems up" data-tr="Tüm sistemler ayakta"></span><span class="url">mkado.dev</span></div>
    </div>
    <div class="print"><img src="../src/assets/art/hero.webp" alt=""></div>
  </div>
  <script>
    var lang = new URLSearchParams(location.search).get('lang') === 'tr' ? 'tr' : 'en';
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-en]').forEach(function (el) { el.textContent = el.getAttribute('data-' + lang); });
  </script>
</body>
</html>
