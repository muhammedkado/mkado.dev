<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 332" class="dg" role="img" aria-labelledby="findjob-title findjob-desc">
<title id="findjob-title">Find Job with AI: the wizard behind the page</title>
<desc id="findjob-desc">A three-step Blade and Alpine.js wizard posts to a Laravel application that extracts text from the PDF, asks Gemini to parse, enhance and score the profile, pulls live postings from JSearch, and falls back to sample data once the shared daily budget is spent.</desc>
<defs>
<marker id="findjob-m" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,8 3,0 6" class="dg-marker"/></marker>
<marker id="findjob-ml" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,8 3,0 6" class="dg-marker link"/></marker>
</defs>
<path d="M168,160 H232" class="dg-arrow link" marker-end="url(#findjob-ml)"/>
<path d="M312,132 V68 Q312,60 320,60 H456" class="dg-arrow" marker-end="url(#findjob-m)"/>
