<path d="M285,188 V212 Q285,220 277,220 H112 Q104,220 104,228 V252" class="dg-arrow dashed" marker-end="url(#findjob-m)"/>
<path d="M339,188 V252 Q339,260 347,260 H456" class="dg-arrow link" marker-end="url(#findjob-ml)"/>
