<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 292" class="dg" role="img" aria-labelledby="invoice-title invoice-desc">
<title id="invoice-title">Invoice system: plain PHP with two libraries</title>
<desc id="invoice-desc">The browser talks to a framework-free PHP 8 application that uses PDO prepared statements against MySQL, renders invoices to PDF with TCPDF and can e-mail them with PHPMailer, which is disabled on the public demo.</desc>
<defs>
<marker id="invoice-m" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,8 3,0 6" class="dg-marker"/></marker>
<marker id="invoice-ml" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,8 3,0 6" class="dg-marker link"/></marker>
</defs>
<path d="M168,120 H232" class="dg-arrow link" marker-end="url(#invoice-ml)"/>
<path d="M408,120 H616" class="dg-arrow" marker-end="url(#invoice-m)"/>
<path d="M291,148 V172 Q291,180 299,180 H312 Q320,180 320,188 V212" class="dg-arrow" marker-end="url(#invoice-m)"/>
<path d="M349,148 V172 Q349,180 357,180 H504 Q512,180 512,188 V212" class="dg-arrow dashed" marker-end="url(#invoice-m)"/>
