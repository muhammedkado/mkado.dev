<text x="42" y="107" class="dg-tag-text" text-anchor="middle">UI</text>
<text x="96" y="124" class="dg-name" text-anchor="middle">Browser</text>
<text x="96" y="138" class="dg-sub" text-anchor="middle">hand-written CSS + JS</text>
