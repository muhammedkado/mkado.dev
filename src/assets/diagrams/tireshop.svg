<text x="528" y="124" class="dg-name" text-anchor="middle">Supabase</text>
<text x="528" y="138" class="dg-sub" text-anchor="middle">auth + PostgreSQL</text>
<rect x="456" y="212" width="144" height="56" rx="6" class="dg-mask"/>
<rect x="456" y="212" width="144" height="56" rx="6" class="dg-node async"/>
<rect x="464" y="218" width="20" height="12" rx="2" class="dg-tag"/>
<text x="474" y="227" class="dg-tag-text" text-anchor="middle">FN</text>
<text x="528" y="244" class="dg-name" text-anchor="middle">Edge Function</text>
<text x="528" y="258" class="dg-sub" text-anchor="middle">low-stock check</text>
<rect x="624" y="212" width="112" height="56" rx="6" class="dg-mask"/>
