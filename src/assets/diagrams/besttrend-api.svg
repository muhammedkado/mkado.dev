<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 404" class="dg" role="img" aria-labelledby="besttrend-api-title besttrend-api-desc">
<title id="besttrend-api-title">BestTrend admin panel and API: one core, two doors</title>
<desc id="besttrend-api-desc">An AdminLTE admin panel with session login and a public, rate-limited REST API with Sanctum tokens sit on the same Laravel core, which owns PostgreSQL and uploads photos to Bunny Storage; the React app is a client of the API.</desc>
