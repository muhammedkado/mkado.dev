<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 292" class="dg" role="img" aria-labelledby="pos-title pos-desc">
<title id="pos-title">POS admin dashboard: how it is built</title>
<desc id="pos-desc">A browser talks over HTTPS to nginx, which hands requests to a Laravel 10 application with Laratrust roles and Arabic/English localisation; the app reads and writes MySQL, and a nightly cron job re-seeds the database.</desc>
