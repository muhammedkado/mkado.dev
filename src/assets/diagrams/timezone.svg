<rect x="280" y="38" width="45" height="12" rx="2" class="dg-tag"/>
<text x="302" y="47" class="dg-tag-text" text-anchor="middle">BROWSER</text>
<text x="352" y="64" class="dg-name" text-anchor="middle">Intl API</text>
<text x="352" y="78" class="dg-sub" text-anchor="middle">browser time zones, formats</text>
<rect x="272" y="132" width="160" height="56" rx="6" class="dg-mask"/>
<rect x="272" y="132" width="160" height="56" rx="6" class="dg-node store"/>
<rect x="280" y="138" width="40" height="12" rx="2" class="dg-tag"/>
