<rect x="460" y="140" width="40" height="12" rx="2" class="dg-mask"/>
<text x="480" y="149" class="dg-label" text-anchor="middle">SERVES</text>
<rect x="40" y="92" width="160" height="56" rx="6" class="dg-mask"/>
<rect x="40" y="92" width="160" height="56" rx="6" class="dg-node focal"/>
<rect x="48" y="98" width="25" height="12" rx="2" class="dg-tag"/>
<text x="60" y="107" class="dg-tag-text" text-anchor="middle">APP</text>
<text x="120" y="124" class="dg-name" text-anchor="middle">React 19 SPA</text>
<text x="120" y="138" class="dg-sub" text-anchor="middle">wouter routes, i18next</text>
<rect x="272" y="32" width="160" height="56" rx="6" class="dg-mask"/>
