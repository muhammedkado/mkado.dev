<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 316" class="dg" role="img" aria-labelledby="timezone-title timezone-desc">
<title id="timezone-title">TimeZone.tools: everything happens in the browser</title>
<desc id="timezone-desc">A React single-page app computes conversions and working days with the browser's Intl API, loads its seven translation files at runtime, keeps state in the URL so links are shareable, and is served as plain static files behind Cloudflare — there is no backend.</desc>
<defs>
<marker id="timezone-m" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,8 3,0 6" class="dg-marker"/></marker>
<marker id="timezone-ml" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,8 3,0 6" class="dg-marker link"/></marker>
</defs>
<path d="M120,92 V68 Q120,60 128,60 H272" class="dg-arrow" marker-end="url(#timezone-m)"/>
<path d="M200,120 H228 Q236,120 236,128 V152 Q236,160 244,160 H272" class="dg-arrow link" marker-end="url(#timezone-ml)"/>
<path d="M120,148 V252 Q120,260 128,260 H272" class="dg-arrow dashed" marker-end="url(#timezone-m)"/>
<path d="M528,160 H432" class="dg-arrow dashed" marker-end="url(#timezone-m)"/>
