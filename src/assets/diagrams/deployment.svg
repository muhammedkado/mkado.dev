<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 452" class="dg" role="img" aria-labelledby="deployment-title deployment-desc">
<title id="deployment-title">How this site and its six demos are deployed</title>
<desc id="deployment-desc">A workstation script pushes code over SSH and uploads local builds; visitors reach the Oracle Cloud VM through Cloudflare's edge, where nginx routes each host to a PHP-FPM pool or a static directory, every app has its own database, and cron jobs re-seed the demos nightly, back up and probe health every five minutes.</desc>
<defs>
<marker id="deployment-m" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,8 3,0 6" class="dg-marker"/></marker>
<marker id="deployment-ml" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,8 3,0 6" class="dg-marker link"/></marker>
</defs>
