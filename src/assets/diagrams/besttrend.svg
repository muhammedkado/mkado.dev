<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 324" class="dg" role="img" aria-labelledby="besttrend-title besttrend-desc">
<title id="besttrend-title">BestTrend: the app, its API and storage</title>
<desc id="besttrend-desc">The React single-page app calls a Laravel REST API with Sanctum tokens; the API owns a PostgreSQL database and uploads listing photos to Bunny Storage, a CDN. The admin panel that shares the API has its own page.</desc>
