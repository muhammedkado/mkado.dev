# /etc/nginx/conf.d/mkado-limits.conf  (installed by ./deploy.sh mkado.dev --nginx)
#
# http-level shared memory for the rate limits used by the vhosts. nginx.conf
# already includes conf.d/*.conf, which is the only place a limit_req_zone can
# live: the directive is not valid inside a server block.
#
# 5 requests/minute per visitor IP for the contact endpoint. The real IP comes
# from the cloudflare-realip snippet, so this counts people and not the edge.
limit_req_zone $binary_remote_addr zone=contact:1m rate=5r/m;
