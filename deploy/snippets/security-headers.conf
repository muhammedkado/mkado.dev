# Shared response headers for every mkado.dev vhost.
# Installed to /etc/nginx/snippets/security-headers.conf by `./deploy.sh mkado.dev --nginx`.
#
# nginx quirk: `add_header` is NOT inherited into a location block that sets any
# add_header of its own — so include this snippet inside such locations too
# (e.g. the long-cache /_astro/ and /assets/ blocks), or the headers vanish there.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# geolocation=(self): the BestTrend property map has a "My Location" button.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
