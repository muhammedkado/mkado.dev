; /etc/php/8.3/fpm/pool.d/mkado.conf  (installed by ./deploy.sh mkado.dev --nginx)
;
; The static site needs PHP for exactly one endpoint: server/contact.php.
; Secrets are NOT here — the script reads /etc/mkado/contact.env (0640 root:www-data),
; so this file can be redeployed freely.
[mkado]
user = www-data
group = www-data

listen = /run/php/mkado.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; One endpoint, occasional traffic: start nothing until a request arrives.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 500

; The endpoint answers JSON; PHP notices must never reach the response body.
php_admin_value[display_errors] = Off
php_admin_value[error_log] = /var/log/mkado/php-error.log
php_admin_flag[log_errors] = On
php_admin_value[post_max_size] = 64K
php_admin_value[upload_max_filesize] = 0
php_admin_value[max_execution_time] = 20
; Nothing but the endpoint and its data directories is reachable from PHP.
php_admin_value[open_basedir] = /var/www/mkado.dev/server:/var/lib/mkado:/var/log/mkado:/etc/mkado
