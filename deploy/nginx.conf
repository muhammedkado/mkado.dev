# /etc/nginx/sites-available/mkado.dev
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mkado.dev www.mkado.dev;

    root /var/www/mkado.dev/dist;
    index index.html;

    ssl_certificate     /etc/ssl/cloudflare/mkado.dev.pem;
    ssl_certificate_key /etc/ssl/cloudflare/mkado.dev.key;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;

    # www -> apex
    if ($host = www.mkado.dev) {
        return 301 https://mkado.dev$request_uri;
    }

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /cv.pdf {
        add_header Content-Disposition 'inline; filename="Muhammed_Kado_CV.pdf"';
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name mkado.dev www.mkado.dev;
    return 301 https://mkado.dev$request_uri;
}
