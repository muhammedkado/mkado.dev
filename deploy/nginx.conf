# /etc/nginx/sites-available/mkado.dev
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mkado.dev www.mkado.dev;

    root /var/www/mkado.dev/dist;
    index index.html;
    error_page 404 /404.html;

    ssl_certificate     /etc/ssl/cloudflare/mkado.dev.pem;
    ssl_certificate_key /etc/ssl/cloudflare/mkado.dev.key;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    # Shared headers (HSTS, nosniff, frame, referrer, permissions) + a CSP for the static site.
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # www -> apex
    if ($host = www.mkado.dev) {
        return 301 https://mkado.dev$request_uri;
    }

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Written every 5 minutes by /usr/local/bin/mkado-status.sh (deploy/mkado-status.sh);
    # lives outside dist/ so a deploy (which swaps dist/) cannot remove it.
    location = /status.json {
        alias /var/www/mkado.dev/status/status.json;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Contact form (server/contact.php). Lives outside dist/ like status.json, because
    # a deploy swaps dist/ wholesale. limit_req keys on the visitor's IP thanks to the
    # cloudflare-realip snippet above; the script applies a per-IP daily cap of its own.
    location = /api/contact {
        limit_req zone=contact burst=3 nodelay;
        limit_req_status 429;   # the form shows "too many messages"; nginx defaults to 503
        limit_except POST { deny all; }

        include /etc/nginx/snippets/security-headers.conf;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/mkado.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/mkado.dev/server/contact.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/mkado.dev/server;
        fastcgi_read_timeout 30;
    }

    location = /cv.pdf {
        add_header Content-Disposition 'inline; filename="Muhammed_Kado_CV.pdf"';
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name mkado.dev www.mkado.dev;
    return 301 https://mkado.dev$request_uri;
}
