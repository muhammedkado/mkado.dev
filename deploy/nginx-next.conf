# /etc/nginx/sites-available/next.mkado.dev
# Preview host for the portfolio: the same static site, served from
# /var/www/mkado.dev/next (uploaded by deploy/deploy-next.sh) so a redesign can be
# checked on a real phone before it replaces mkado.dev. Kept out of search
# engines; shares the status probe and the contact endpoint with production.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name next.mkado.dev;

    root /var/www/mkado.dev/next;
    index index.html;
    error_page 404 /404.html;

    ssl_certificate     /etc/ssl/cloudflare/mkado.dev.pem;
    ssl_certificate_key /etc/ssl/cloudflare/mkado.dev.key;

    include /etc/nginx/snippets/cloudflare-realip.conf;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /status.json {
        alias /var/www/mkado.dev/status/status.json;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /api/contact {
        limit_req zone=contact burst=3 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }

        include /etc/nginx/snippets/security-headers.conf;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/mkado.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/mkado.dev/server/contact.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/mkado.dev/server;
        fastcgi_read_timeout 30;
    }

    location = /cv.pdf {
        add_header Content-Disposition 'inline; filename="Muhammed_Kado_CV.pdf"';
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name next.mkado.dev;
    return 301 https://next.mkado.dev$request_uri;
}
